name: Publish Python 🐍 distributions 📦 to PyPI

on:
  push:
    tags:
     - '*'

jobs:
  build:
    name: Build distribution 📦
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    - name: Set up uv
      uses: astral-sh/setup-uv@v4
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get -y install libcgal-dev pybind11-dev patchelf
        uv pip install --system -r requirements.txt
        uv pip install --system build auditwheel
    - name: Build distribution
      run: uv run python -m build
    - name: Repair Linux wheels for PyPI
      run: |
        shopt -s nullglob
        wheels=(dist/*-linux_x86_64.whl)
        if [ ${#wheels[@]} -gt 0 ]; then
          mkdir -p wheelhouse
          for wheel in "${wheels[@]}"; do
            uv run auditwheel repair "$wheel" -w wheelhouse
            rm "$wheel"
          done
          cp wheelhouse/*.whl dist/
        fi
    - name: Upload distribution
      uses: actions/upload-artifact@v4
      with:
        name: python-distribution
        path: dist/*

  publish-to-pypi:
    name: Publish Python 🐍 distribution 📦 to PyPI
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-22.04
    environment:
      name: release
      url: https://pypi.org/p/trajgenpy  # Replace with your PyPI project name
    permissions:
      id-token: write
    steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.x"
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: python-distribution
        path: dist
    - name: Publish distribution 📦 to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Sign and upload to GitHub Release
    needs: publish-to-pypi
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: python-distribution
        path: dist/
    - name: Sign the distributions
      uses: sigstore/gh-action-sigstore-python@v3.0.0
      with:
        inputs: ./dist/*
    - name: Upload to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: dist/*
        fail_on_unmatched_files: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
