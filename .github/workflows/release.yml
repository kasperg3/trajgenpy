name: Publish Python 🐍 distributions 📦 to PyPI

on:
  push:
    tags:
     - '*'
  workflow_dispatch:

jobs:
  build-wheels:
    name: Build wheels (manylinux x86_64)
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - name: Build wheels
      uses: pypa/cibuildwheel@v2.23.4
      env:
        CIBW_BUILD: "cp310-manylinux_x86_64 cp311-manylinux_x86_64 cp312-manylinux_x86_64 cp313-manylinux_x86_64 cp314-manylinux_x86_64"
        # AlmaLinux 8 image; EPEL 8 provides cgal-devel (CGAL 5.6.3).
        CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
        # CGAL (header-only) plus its gmp/mpfr/boost dependencies is required
        # to compile the pybind11 bindings.
        CIBW_BEFORE_ALL_LINUX: |
          yum install -y epel-release
          yum install -y cgal-devel
        # The wheel is installed with its dependencies; pytest runs the suite
        # from /tmp so the source tree does not shadow the installed package.
        CIBW_TEST_REQUIRES: pytest
        CIBW_TEST_COMMAND: sh -c "cd /tmp && python -m pytest -q {project}/tests"
    - name: Upload wheels
      uses: actions/upload-artifact@v4
      with:
        name: wheels
        path: wheelhouse/*.whl

  build-sdist:
    name: Build source distribution 📦
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Build sdist
      run: |
        python -m pip install build
        python -m build --sdist
    - name: Upload sdist
      uses: actions/upload-artifact@v4
      with:
        name: sdist
        path: dist/*.tar.gz

  publish-to-pypi:
    name: Publish Python 🐍 distributions 📦 to PyPI
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-22.04
    environment:
      name: release
      url: https://pypi.org/p/trajgenpy
    permissions:
      id-token: write
    steps:
    - name: Download wheels
      uses: actions/download-artifact@v4
      with:
        name: wheels
        path: dist
    - name: Download sdist
      uses: actions/download-artifact@v4
      with:
        name: sdist
        path: dist
    - name: Publish distribution 📦 to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Sign and upload to GitHub Release
    needs: publish-to-pypi
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
    steps:
    - name: Download wheels
      uses: actions/download-artifact@v4
      with:
        name: wheels
        path: dist/
    - name: Download sdist
      uses: actions/download-artifact@v4
      with:
        name: sdist
        path: dist/
    - name: Sign the distributions
      uses: sigstore/gh-action-sigstore-python@v3.0.0
      with:
        inputs: ./dist/*.tar.gz ./dist/*.whl
    - name: Upload to GitHub Release
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        gh release create "${{ github.ref_name }}" dist/* --repo "${{ github.repository }}"

